name: CI (Android)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "api/**"
      - "services/**"
      - "contracts/**"
      - "deploy/**"
      - "Caddyfile*"
      - "docker-compose*.yml"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "api/**"
      - "services/**"
      - "contracts/**"
      - "deploy/**"
      - "Caddyfile*"
      - "docker-compose*.yml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37.2
        run: sdkmanager "platforms;android-37.2" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests, lint, and build Android artifacts
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease

      - name: Enable KVM for device tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          working-directory: ./android
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest || (find app/build/outputs/androidTest-results -type f -name '*.xml' -exec cat {} \; ; exit 1)

      - name: Upload Android test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: planora-android-tests-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: planora-android-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
