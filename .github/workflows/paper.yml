name: Build (Paper)

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  build-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install TeX tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chktex \
            latexmk \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-publishers \
            texlive-science

      - name: Lint with chktex
        working-directory: paper
        run: chktex -q -n1 -n8 main.tex

      - name: Verify IEEEtran availability
        working-directory: paper
        run: kpsewhich IEEEtran.cls

      - name: Build PDF
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
